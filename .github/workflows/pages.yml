name: Pages

# Publishes site/ (the App Store support
# and privacy pages) to GitHub Pages, at
# https://<owner>.github.io/<repo>/ and
# .../privacy.html, on each push to main
# that changes them. Needs Settings → Pages
# → Source set to "GitHub Actions" once
# (docs/NEW-APP.md).
on:
  push:
    branches: [main]
    paths:
      - site/**
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish
    # Not in the template itself: its pages
    # are only the starting point for an
    # app's.
    if: >-
      !endsWith(github.repository,
      '/ios-template')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: >-
        ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v5
