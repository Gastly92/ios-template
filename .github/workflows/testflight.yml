name: Shared TestFlight

# Archives an app and uploads it to
# TestFlight. An app's own testflight.yml
# (run by hand: Actions → TestFlight → Run
# workflow) calls this one at a pinned
# version, with `secrets: inherit`. Signing
# is done by Apple ("cloud signing") using
# the App Store Connect API key, so no
# certificates or provisioning profiles are
# stored in the repo. Needs the repo
# secrets APPLE_TEAM_ID, ASC_KEY_ID,
# ASC_ISSUER_ID and ASC_KEY_P8.
on:
  workflow_call:

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 45.
jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    # Write access to push the build's tag.
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID:
        ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:
        ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
    - name: Check secrets
      run: |
        missing=""
        for name in APPLE_TEAM_ID \
          ASC_KEY_ID ASC_KEY_P8 \
          ASC_ISSUER_ID; do
          [ -n "${!name}" ] \
            || missing+=" $name"
        done
        if [ -n "$missing" ]; then
          echo "::error::Missing" \
            "repository secrets:$missing" \
            "(see the template's" \
            "docs/NEW-APP.md)"
          exit 1
        fi

    - uses: actions/checkout@v7

    # The template (for its Base package), at
    # the commit this workflow runs from
    # (job.workflow_*, read from the whole
    # context: actionlint doesn't know those
    # fields yet).
    - name: Find the template
      id: source
      env:
        JOB: ${{ toJSON(job) }}
      run: |
        repo=$(jq -r .workflow_repository \
          <<<"$JOB")
        sha=$(jq -r .workflow_sha <<<"$JOB")
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: >-
          ${{ steps.source.outputs.repo }}
        ref: ${{ steps.source.outputs.sha }}
        path: .template

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Find the app
      run: |
        app=$(sed -n 's/^name: *//p' \
          project.yml)
        {
          echo "APP=$app"
          echo "ARCHIVE=build/$app.xcarchive"
        } >> "$GITHUB_ENV"

    - name: Write API key
      run: |
        dir="$RUNNER_TEMP/keys"
        mkdir -p "$dir"
        KEY_PATH="$dir/AuthKey_$ASC_KEY_ID.p8"
        printf '%s\n' "$ASC_KEY_P8" \
          > "$KEY_PATH"
        echo "KEY_PATH=$KEY_PATH" \
          >> "$GITHUB_ENV"

    # Archive unsigned; the export step below
    # signs with Apple's cloud-managed
    # distribution certificate and uploads to
    # App Store Connect.
    - name: Archive
      run: |
        set -o pipefail
        num="$GITHUB_RUN_NUMBER"
        xcodebuild archive \
          -project "$APP.xcodeproj" \
          -scheme "$APP" \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath "$ARCHIVE" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CURRENT_PROJECT_VERSION="$num" \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 30

    - name: Sign & upload
      run: |
        options=build/ExportOptions.plist
        cat > "$options" <<PLIST
        <?xml version="1.0"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>upload</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
        </dict>
        </plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE" \
          -exportOptionsPlist "$options" \
          -exportPath build/export \
          -allowProvisioningUpdates \
          -authenticationKeyPath \
          "$KEY_PATH" \
          -authenticationKeyID \
          "$ASC_KEY_ID" \
          -authenticationKeyIssuerID \
          "$ASC_ISSUER_ID"

    # Marks the uploaded commit, e.g.
    # v0.4.6-build12, so it's clear what each
    # TestFlight build contains.
    - name: Tag the build
      run: |
        pattern='s/.*"([^"]+)".*/\1/'
        key=MARKETING_VERSION
        version=$(
          grep -m1 "$key" project.yml \
            | sed -E "$pattern"
        )
        num="$GITHUB_RUN_NUMBER"
        tag="v$version-build$num"
        git tag "$tag"
        git push origin "$tag"
        echo "TAG=$tag" >> "$GITHUB_ENV"

    - name: Summary
      run: |
        num="$GITHUB_RUN_NUMBER"
        {
          echo "Uploaded build $num to App" \
            "Store Connect."
          echo "Tagged $TAG."
          echo "It appears in TestFlight" \
            "after Apple finishes" \
            "processing (usually 5–15 min)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Remove API key
      if: always()
      run: rm -rf "$RUNNER_TEMP/keys"
