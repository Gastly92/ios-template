# Dependabot opens a PR when a newer version
# of something the app depends on is out:
# the GitHub Actions the workflows use,
# SwiftLint, and the test-only Swift
# packages. Weekly, grouped so it stays
# quiet.
# Each PR is assigned to the user: GitHub
# emails assignees, but a bot's PR alone
# only notifies those watching the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [Gastly92]
    groups:
      actions:
        patterns: ["*"]
  # SwiftLint, pinned in this Dockerfile.
  - package-ecosystem: docker
    directory: /.github/swiftlint
    schedule:
      interval: weekly
    assignees: [Gastly92]
    # Old images tagged by Swift version
    # (5.5-0.47.0, 5.5-0.47.1, 5.5-0.48.0,
    # 5.5-latest, from 2022) look newer
    # than 0.65.1 but aren't. The range
    # skips only those (and any real
    # 5.5.x release, if one ever comes).
    ignore:
      - dependency-name: realm/swiftlint
        versions: [">= 5.5, < 5.6"]
  - package-ecosystem: swift
    directory: /Packages/TestSupport
    schedule:
      interval: weekly
    assignees: [Gastly92]
    groups:
      swift:
        patterns: ["*"]
