# The shared SwiftLint rules. Each app's
# .swiftlint.yml names this file as its
# `parent_config` (in .template/, the
# template checked out at the version the
# app pins) and lists its own folders under
# `included:`, plus any extra rules.
# CI runs `swiftlint lint --strict`, so
# warnings fail the build.

# Every opt-in rule is on. Rules below are
# off on purpose: where two rules disagree,
# the one that keeps code shorter wins, since
# lines are capped at 45.
opt_in_rules:
  - all

disabled_rules:
  # Multi-line lists end with a trailing
  # comma here, so diffs stay one line.
  - trailing_comma

  # Longer code, against the 45 limit:
  # Writing every type out
  # (redundant_type_annotation, on, does the
  # opposite).
  - explicit_type_interface
  # `internal` on every declaration.
  - explicit_acl
  - explicit_top_level_acl
  # `case push = "push"` for every case.
  - explicit_enum_raw_value
  # A `k` prefix on top-level constants.
  - prefixed_toplevel_constant
  # Named arguments instead of `$0` in
  # multi-line closures.
  - anonymous_argument_in_multiline_closure
  - shorthand_argument
  # Defaults keep call sites short.
  - discouraged_default_parameter
  # A named constant for every padding and
  # size in views.
  - no_magic_numbers

  # Conflicts with a rule that's on:
  # `private extension` once is shorter than
  # `private` on each member
  # (extension_access_modifier, on).
  - no_extension_access_modifier
  # Wants @preconcurrency on public
  # concurrency annotations (the Base
  # package's), for Swift 5 users; every
  # app is Swift 6, and the
  # unchecked_concurrency rule bans
  # @preconcurrency.
  - incompatible_concurrency_annotation
  # Brace on its own line; opening_brace
  # wants it on the same line.
  - contrasted_opening_brace
  # Hand-aligned arguments; indentation_width
  # wants one level in.
  - vertical_parameter_alignment_on_call

  # Doesn't fit these apps:
  # Views keep small helpers and extensions
  # next to the screen they belong to.
  - one_declaration_per_file
  - no_grouping_extension
  # Fixed member/type order adds churn;
  # files are ordered by reading flow.
  - file_types_order
  - type_contents_order
  # ScreenID lists screens in app flow order.
  - sorted_enum_cases
  # Boilerplate: a header in every file, a
  # deinit in every class, a tearDown for
  # every setUp.
  - file_header
  - required_deinit
  - balanced_xctest_lifecycle
  # Tests use XCTest, not Nimble/Quick.
  - prefer_nimble
  # A blank line between every switch case:
  # longer files, nothing gained.
  - vertical_whitespace_between_cases
  # Helper files hold several small helpers
  # (e.g. ViewHelpers.swift), not one type.
  - file_name
  # SwiftData models synced with CloudKit
  # need optional relationships.
  - discouraged_optional_collection

# 2-space indents; a wrapped line goes in one
# level (2), not aligned by hand.
indentation_width:
  indentation_width: 2

identifier_name:
  excluded:
    - id

# Diffs get read in the GitHub iPhone app; 45
# fits a portrait line without wrapping. Long
# lines also point at names that could be
# shorter.
line_length:
  warning: 45
  ignores_urls: true

# Attributes that take a line of their own,
# so the declaration after them stays short.
attributes:
  always_on_line_above:
    - "@ViewBuilder"
    - "@MainActor"
    - "@ToolbarContentBuilder"

# Separators from 10_000 up; 2026 and 9999
# read fine as they are.
number_separator:
  minimum_length: 5

# A switch over an enum (e.g. ScreenHost)
# isn't complex, however many cases it has.
cyclomatic_complexity:
  ignores_case_statements: true

custom_rules:
  # A fixed font size doesn't grow with the
  # user's text size. Use a text style, or a
  # @ScaledMetric size for big icons and
  # numbers.
  fixed_font_size:
    name: "Fixed font size"
    message: >-
      Use a text style, or a @ScaledMetric
      size, so text scales.
    regex: '\.system\(\s*size:\s*[0-9]'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  # Swift 6 mode makes data races compile
  # errors; these switch that check off for
  # a type, value or import. Thread
  # Sanitizer was dropped because nothing
  # uses them; using one means adding it
  # back to run-tests.sh.
  unchecked_concurrency:
    name: "Unchecked concurrency"
    message: >-
      This skips Swift's data race check.
      Make the type safe instead.
    regex: >-
      @unchecked\s+Sendable|nonisolated\(unsafe\)|@preconcurrency
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  # Sentences shown to users must be
  # translatable. In views, literals passed
  # to Text are; in logic they need
  # String(localized:). Catches e.g.
  # `return "Nice work!"`.
  untranslated_logic_text:
    name: "Untranslated text"
    message: >-
      Wrap user-facing text in
      String(localized:) so it can be
      translated.
    included:
      "[^/]+/(Models|Support)/.*\\.swift"
    # One pattern; the line break below reads
    # as its one space.
    regex:
      '(?<!localized)(\breturn|\?|:)\s+"[A-Z][^"\n]*
      [^"\n]*"'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
