# Dependabot opens a PR when a newer version
# of something the template depends on is
# out: the GitHub Actions the shared
# workflows use, SwiftLint, and the Swift
# packages Base uses. Weekly, grouped so it
# stays quiet. Apps get these through a new
# template version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # SwiftLint, pinned in this Dockerfile.
  - package-ecosystem: docker
    directory: /swiftlint
    schedule:
      interval: weekly
    # Old images tagged by Swift version
    # (5.5-0.47.0, 5.5-0.47.1, 5.5-0.48.0,
    # 5.5-latest, from 2022) look newer
    # than 0.65.1 but aren't. The range
    # skips only those (and any real
    # 5.5.x release, if one ever comes).
    ignore:
      - dependency-name: realm/swiftlint
        versions: [">= 5.5, < 5.6"]
  - package-ecosystem: swift
    directory: /Packages/Base
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
