name: Shared CI

# The CI every app runs. An app's own
# workflow (build.yml) calls this one at a
# pinned version; see RULES.md. Each job
# checks out the app, then the template at
# that same version in .template/ (its
# scripts, SwiftLint rules and Base
# package). The app is the `name:` in its
# project.yml.
on:
  workflow_call:

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 45.
jobs:
  # Decides whether the PR touches anything
  # that affects the app, and finds the
  # template's version.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: >-
        ${{ github.event_name !=
        'pull_request' ||
        steps.filter.outputs.code ==
        'true' }}
      repo: ${{ steps.source.outputs.repo }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
    # This workflow's own repo and commit
    # (job.workflow_*). Read from the whole
    # context: actionlint doesn't know those
    # fields yet.
    - name: Find the template
      id: source
      env:
        JOB: ${{ toJSON(job) }}
      run: |
        field() {
          jq -r ".workflow_$1 // empty" \
            <<<"$JOB"
        }
        repo=$(field repository)
        sha=$(field sha)
        if [ -z "$repo" ] || [ -z "$sha" ]
        then
          echo "::error::No workflow" \
            "repository or commit in the" \
            "job context."
          exit 1
        fi
        echo "Template: $repo at $sha"
        {
          echo "repo=$repo"
          echo "sha=$sha"
        } >> "$GITHUB_OUTPUT"

    # Anything but docs counts.
    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'pull_request'
      with:
        predicate-quantifier: every
        filters: |
          code:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!site/**'

  # Docs, YAML and scripts fit in 45
  # characters too (Swift is SwiftLint's).
  # Runs on every PR, docs-only ones too.
  lines:
    name: Line length
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # The template, at the commit this
    # workflow runs from.
    - &template
      uses: actions/checkout@v7
      with:
        repository: >-
          ${{ needs.changes.outputs.repo }}
        ref: ${{ needs.changes.outputs.sha }}
        path: .template

    - name: Check line length
      run: .template/scripts/check-lines.py

  # Every String Catalog key is still used
  # by some Swift string.
  strings:
    name: String catalog
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Check for unused keys
      run: .template/scripts/check-strings.py

  # Static checks for the workflows
  # (actionlint) and shell scripts
  # (ShellCheck), so a broken TestFlight
  # workflow shows up before it's run.
  # Pinned; same versions run locally.
  scripts:
    name: Workflows & scripts
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Install checkers
      run: |
        venv="$RUNNER_TEMP/venv"
        python3 -m venv "$venv"
        "$venv/bin/pip" install -q \
          -r .template/scripts/checkers.txt
        echo "$venv/bin" >> "$GITHUB_PATH"

    # Every shell script in the repo.
    - name: ShellCheck
      run: |
        git ls-files -z '*.sh' \
          | xargs -0 -r shellcheck

    # Also runs ShellCheck on each `run:`
    # block.
    - name: actionlint
      run: actionlint

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - *template

    # The same script Claude runs before
    # pushing; the version is pinned in the
    # template's swiftlint/Dockerfile.
    - name: Lint
      run: .template/scripts/swiftlint.sh

  # Every screen must be in the screen list
  # (ScreenID / ScreenHost), so snapshot
  # and localization tests cover it.
  screens:
    name: Screen list
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Check every screen is listed
      run: .template/scripts/check-screens.sh

  # Builds the app and tests once, for the
  # test shards below.
  build:
    name: Build for testing
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    # The last build from main (packages
    # like swift-syntax compile once, not on
    # every run). Changed files rebuild as
    # usual. Saved only from main, so a PR
    # never feeds another.
    - name: Cache key
      id: key
      run: |
        xcode=$(
          xcodebuild -version | head -1
        )
        deps=(project.yml .template/Packages)
        if [ -d Packages ]; then
          deps+=(Packages)
        fi
        sum=$(find "${deps[@]}" -type f \
          | sort | xargs cat | shasum \
          | cut -c1-12)
        prefix="build-${xcode// /-}-$sum"
        echo "prefix=$prefix" \
          >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      with:
        path: build/test
        key: >-
          ${{ steps.key.outputs.prefix }}-${{
          github.sha }}
        restore-keys: >-
          ${{ steps.key.outputs.prefix }}-

    - name: Build
      run: >-
        .template/scripts/run-tests.sh
        build

    - uses: actions/cache/save@v6
      if: github.ref == 'refs/heads/main'
      with:
        path: build/test
        key: >-
          ${{ steps.key.outputs.prefix }}-${{
          github.sha }}

    # A tar keeps the apps' permissions and
    # links, which artifacts drop.
    - name: Pack the build
      run: >-
        tar -cf build/products.tar
        build/test/Build/Products

    - uses: actions/upload-artifact@v7
      with:
        name: test-build
        path: build/products.tar
        retention-days: 1

    # Unused code (functions, properties,
    # types). Reuses the build's index, while
    # the tests run. Public code is the Base
    # package's, used by other apps.
    - name: Periphery
      run: |
        brew install periphery
        periphery version
        app=$(sed -n 's/^name: *//p' \
          project.yml)
        index=build/test/Index.noindex
        periphery scan \
          --project "$app.xcodeproj" \
          --schemes "$app" \
          --skip-build \
          --index-store-path \
          "$index/DataStore" \
          --retain-swift-ui-previews \
          --retain-public \
          --relative-results \
          --format github-actions \
          --strict

  # The tests, split into shards that run in
  # parallel on separate runners (one
  # simulator each). See run-tests.sh.
  test:
    name: Test (${{ matrix.shard }})
    needs: [changes, build]
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [main, localization]
    # Write access only to commit recorded
    # snapshot images to the PR branch.
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Boot the simulator
      # Takes seconds; a hung runner sat
      # here until the job's limit.
      timeout-minutes: 5
      run: >-
        .template/scripts/run-tests.sh
        boot

    - uses: actions/download-artifact@v8
      with:
        name: test-build
        path: build

    - name: Unpack the build
      run: tar -xf build/products.tar

    - name: Run tests
      # Only the run the label started
      # records everything; a later run (the
      # bot's commit) while the label is
      # still on records only what's missing.
      env:
        RECORD_ALL: >-
          ${{
          github.event.action == 'labeled'
          && github.event.label.name
          == 'record-snapshots' }}
      run: >-
        .template/scripts/run-tests.sh test
        ${{ matrix.shard }}

    # New screens' images (or all, with the
    # label) go to the PR branch, and the
    # app's workflow runs again on that
    # commit. Snapshot tests are in the main
    # shard.
    - name: Save snapshot images
      if: >-
        always() && matrix.shard == 'main'
        && github.event_name
        == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref }}
        PR: ${{ github.event.number }}
        REF: ${{ github.workflow_ref }}
      run: |
        file="${REF%%@*}"
        export WORKFLOW="${file##*/}"
        .template/scripts/save-snapshots.sh

    # On a mismatch: the reference, the new
    # image and their difference.
    - name: Upload snapshot diffs
      if: failure() && matrix.shard == 'main'
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-diffs
        path: build/snapshot-diffs
        if-no-files-found: ignore

    # For the coverage gate, which merges
    # all shards.
    - name: Pack the results
      if: always()
      run: >-
        tar -cf build/result.tar
        build/test.xcresult

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: result-${{ matrix.shard }}
        path: build/result.tar
        retention-days: 1

  # Every line of the app runs in some
  # shard's tests.
  coverage:
    name: Coverage
    needs: [changes, test]
    runs-on: macos-26
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - *template

    - uses: actions/download-artifact@v8
      with:
        pattern: result-*

    - name: Merge the shards' results
      run: |
        results=()
        for tar in result-*/result.tar; do
          dir="${tar%/result.tar}"
          tar -xf "$tar" -C "$dir"
          results+=(
            "$dir/build/test.xcresult"
          )
        done
        xcrun xcresulttool merge \
          "${results[@]}" \
          --output-path merged.xcresult

    - name: Coverage gate
      run: >-
        .template/scripts/coverage.sh
        merged.xcresult

    # The localization shard opens every
    # ScreenID and nothing else, so its
    # coverage is what the screen list (and
    # so the snapshots) draws.
    - name: Screen list gate
      if: always()
      run: >-
        .template/scripts/unpictured.sh
        result-localization/build/test.xcresult

  # The Release build for a real iPhone, in
  # parallel with the tests so it doesn't add
  # to the wait. Catches anything that only
  # breaks with optimizations on.
  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - *template

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build for device (Release)
      run: |
        set -o pipefail
        app=$(sed -n 's/^name: *//p' \
          project.yml)
        xcodebuild build \
          -project "$app.xcodeproj" \
          -scheme "$app" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/device \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 20

  # Single pass/fail check for a PR. It
  # always reports, passing when the build
  # was skipped (docs-only PR) or succeeded.
  gate:
    name: Gate
    needs:
    - changes
    - lines
    - strings
    - scripts
    - lint
    - screens
    - build
    - test
    - coverage
    - release
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      env:
        CHANGES: ${{ needs.changes.result }}
        LINES: ${{ needs.lines.result }}
        STRINGS: ${{ needs.strings.result }}
        SCRIPTS: ${{ needs.scripts.result }}
        LINT: ${{ needs.lint.result }}
        SCREENS: ${{ needs.screens.result }}
        BUILD: ${{ needs.build.result }}
        TEST: ${{ needs.test.result }}
        COVER: ${{ needs.coverage.result }}
        RELEASE: ${{ needs.release.result }}
      run: |
        for job in CHANGES LINES STRINGS \
          SCRIPTS LINT SCREENS BUILD TEST \
          COVER RELEASE; do
          echo "$job: ${!job}"
        done
        [ "$CHANGES" = success ] || exit 1
        [ "$LINES" = success ] || exit 1
        [ "$STRINGS" = success ] || exit 1
        [ "$SCRIPTS" = success ] || exit 1
        for result in "$LINT" "$SCREENS" \
          "$BUILD" "$TEST" "$COVER" \
          "$RELEASE"; do
          case "$result" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
        done
