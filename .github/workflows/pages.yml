name: Shared Pages

# Publishes an app's site/ (its App Store
# support and privacy pages) to GitHub
# Pages, at
# https://<owner>.github.io/<repo>/ and
# .../privacy.html. An app's own pages.yml
# calls this one at a pinned version, on
# every push to main that changes site/.
# Needs Settings → Pages → Source set to
# "GitHub Actions" once (docs/NEW-APP.md).
on:
  workflow_call:

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: >-
        ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v5
